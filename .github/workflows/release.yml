name: release
# Push a tag v* (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build the
# release binaries, publish a GitHub Release, and bump the Homebrew formula.
#
# - linux-x86_64: fully static, built with NO_CURL=1 (libcurl's TLS stack does
#   not link statically in a portable way); --update runs the curl command.
#   Runs on any glibc or musl distribution, including older HPC systems.
# - macos-arm64 / macos-x86_64: linked against the system libcurl in /usr/lib
#   only (never Homebrew's), so they run on a stock Mac.
# Run it by hand (Actions > release > Run workflow) to test the builds without
# publishing anything; only a tag push publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            make_args: NO_CURL=1 STATIC=1
          - target: macos-arm64
            os: macos-latest
            make_args: CURL_CFLAGS= CURL_LIBS=-lcurl
          - target: macos-x86_64
            os: macos-latest       # cross-compile on Apple Silicon
            make_args: CURL_CFLAGS= CURL_LIBS=-lcurl EXTRA_CFLAGS="-arch x86_64" EXTRA_LDFLAGS="-arch x86_64"
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Build (embeds the latest manual)
        run: make ${{ matrix.make_args }}
      - name: Check linkage
        shell: bash
        run: |
          set -euo pipefail
          file bpp-docs
          case "${{ matrix.target }}" in
            linux-*)
              file bpp-docs | grep -q "statically linked" ;;
            macos-*)
              ARCH="${{ matrix.target }}"; ARCH="${ARCH#macos-}"
              file bpp-docs | grep -q "$ARCH"
              otool -L bpp-docs
              if otool -L bpp-docs | tail -n +2 | grep -v -E '^\s+(/usr/lib/|/System/)'; then
                echo "linked against a library that a stock Mac does not have" >&2
                exit 1
              fi ;;
          esac
      - name: Smoke test
        if: matrix.target != 'macos-x86_64'
        run: ./bpp-docs --version && ./bpp-docs --syntax phase && ./bpp-docs --list | head -3 && ./bpp-docs --json thetaprior | head -c 80
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="bpp-docs-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp bpp-docs README.md LICENSE "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bpp-docs-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum bpp-docs-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bpp-docs-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
  bump-homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      # Formula builds from the source tarball. HOMEBREW_TAP_TOKEN4 is a PAT with
      # Contents:write on bpp/homebrew-tap; Formula/bpp-docs.rb must be seeded
      # there once from packaging/bpp-docs.rb.
      - name: Bump formula in bpp/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN4 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          URL="https://github.com/bpp/bpp-docs/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL -o src.tar.gz "$URL"
          SHA="$(sha256sum src.tar.gz | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/bpp/homebrew-tap.git" tap
          cd tap
          python3 - "$URL" "$SHA" <<'PY'
          import re, sys
          url, sha = sys.argv[1], sys.argv[2]
          p = "Formula/bpp-docs.rb"; s = open(p).read()
          s = re.sub(r'^(\s*)url ".*"$', lambda m: m.group(1)+f'url "{url}"', s, count=1, flags=re.M)
          s = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', s, count=1)
          open(p, "w").write(s)
          PY
          git config user.name  "bpp-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git diff --quiet && { echo "already current"; exit 0; }
          git commit -am "bpp-docs ${VER}"
          git push origin HEAD:main
